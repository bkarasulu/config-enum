[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "config_enum"
dynamic = ["version"]
description = "Automated enumeration of defect (vacancy/dopant/interstitial) configurations with DFT (VASP, CASTEP) and machine-learning potentials"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Bora Karasulu" }]
keywords = ["defects", "dopants", "vacancies", "configuration enumeration", "site disorder", "DFT", "VASP", "CASTEP", "ASE", "machine-learning potentials"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy",
    "ase>=3.23",
    "spglib>=2.0",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest", "pyyaml"]
yaml = ["pyyaml"]
docs = ["mkdocs-material", "mkdocstrings[python]"]
lint = ["ruff"]
# machine-learning potentials (--mlip <name>); install the ones you need
mace = ["mace-torch"]
chgnet = ["chgnet"]
matgl = ["matgl"]
sevennet = ["sevenn"]
orb = ["orb-models"]
fairchem = ["fairchem-core"]
nequip = ["nequip"]
allegro = ["nequip-allegro"]

[project.urls]
Homepage = "https://github.com/bkarasulu/config-enum"
Issues = "https://github.com/bkarasulu/config-enum/issues"

[project.scripts]
config_enum = "config_enum.cli:main"

[tool.setuptools.dynamic]
version = { attr = "config_enum.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 160
extend-exclude = ["legacy", "site"]

[tool.ruff.lint]
# pyflakes-level checks (undefined names, unused imports/variables, syntax) plus a few error-prone patterns
select = ["F", "E9", "B006", "B008"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"src/config_enum/__init__.py" = ["F401"]
